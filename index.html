<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Privado | Comunidade Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f0f10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f4f4f5;
        }
        p {
            font-size: 14px;
            color: #a1a1aa;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #16a34a;
        }
        .footer-note {
            font-size: 11px;
            color: #52525b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">📁</div>
        <h1>Comunidade de Acervos & Mídias</h1>
        <p>Você foi convidado para acessar nosso canal exclusivo no Telegram. Clique no botão abaixo para ser redirecionado com segurança.</p>
        
        <!-- SUBS TUTA O LINK ABAIXO PELO LINK DO SEU CANAL FREE -->
        <a href="https://t.me/verificadasmodelos" class="btn">ENTRAR NO CANAL AGORA 🚀</a>
        
        <div class="footer-note">
            Ambiente seguro • Redirecionamento criptografado
        </div>
    </div>

</body>
</html>
